name: apply fronts

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-fronts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply false-front patch
        run: |
          set -euo pipefail
          cat .github/fronts/part-00.txt .github/fronts/part-01.txt .github/fronts/part-02.txt .github/fronts/part-03.txt .github/fronts/part-04.txt > /tmp/patch.b64
          echo "2ad74fe10a569b1f2e90942dd1d5c8640ada207e6b41e22c11145f22f7e06eaa  /tmp/patch.b64" | sha256sum -c -
          base64 -d /tmp/patch.b64 | gzip -dc > /tmp/change.diff
          git apply --check /tmp/change.diff
          git apply /tmp/change.diff
          rm -rf .github/fronts
          rm -f .github/workflows/apply-fronts.yml
          git add -A
          git config user.name "MCR-Game-Project"
          git config user.email "mcr@steinjager.com"
          python3 - <<'PY'
          import subprocess
          msg = (
              "Give the false fronts cornices and fill in the street.\n"
              "\n"
              "Frame shops now have square parapets with brackets, dentils, and a frieze. A few have a small center pediment, a step, or a shallow arch. Ball Bros. keeps its triangular front, with cornice returns so the peak is a pediment. Yards have trees, the streets have grass edges, puddles, and plank crossings, and the sky meets a prairie horizon.\n"
              "\n"
              "Co-authored-by: mcr <mcr@steinjager.com>\n"
          )
          subprocess.run(["git", "commit", "-m", msg], check=True)
          PY
          git push origin HEAD:main

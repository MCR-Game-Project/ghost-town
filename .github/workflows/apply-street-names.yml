name: apply street names
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-street-names.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: Apply the street-name patch and remove this helper
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          raw = pathlib.Path(".github/apply-street-names.b64").read_text().strip()
          chars = list(raw)
          # Three characters were altered when the payload was uploaded.
          fixes = {2610: "p", 2611: "n", 4098: "y"}
          for index, char in fixes.items():
              chars[index] = char
          raw = "".join(chars)
          digest = hashlib.sha256(raw.encode()).hexdigest()
          expected = "b4bd8bd5446b0a8818f1db57de73849a4a6f07825e5a9b7e0cfd3b5938942843"
          if digest != expected:
              raise SystemExit("payload hash " + digest)
          pathlib.Path("/tmp/change.diff").write_bytes(gzip.decompress(base64.b64decode(raw)))
          subprocess.check_call(["git", "apply", "--check", "/tmp/change.diff"])
          subprocess.check_call(["git", "apply", "/tmp/change.diff"])
          pathlib.Path(".github/workflows/apply-street-names.yml").unlink()
          pathlib.Path(".github/apply-street-names.b64").unlink()
          subprocess.check_call(["git", "config", "user.email", "mcr@steinjager.com"])
          subprocess.check_call(["git", "config", "user.name", "MCR-Game-Project"])
          subprocess.check_call(["git", "add", "-A"])
          message = (
              "Show street names and match the Ball Bros. gable.\n"
              "\n"
              "The names already in the town file are painted on corner posts and along the roads, "
              "and they stay readable from overhead. Horses and wagons are low-poly models with harness, "
              "spoked wheels, and a box bed, sized to the storefronts. Ball Bros. now has the full-width "
              "triangular false front from the 1880s photograph.\n"
          )
          subprocess.check_call(["git", "commit", "-m", message])
          subprocess.check_call(["git", "push", "origin", "HEAD:main"])
          PY

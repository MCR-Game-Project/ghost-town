name: apply mark placement

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-mark-place.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply placement patch
        run: |
          set -euo pipefail
          cat .github/mark-place/part-00.txt .github/mark-place/part-01.txt .github/mark-place/part-02.txt .github/mark-place/part-03.txt .github/mark-place/part-04.txt .github/mark-place/part-05.txt .github/mark-place/part-06.txt .github/mark-place/part-07.txt > /tmp/patch.b64
          echo "9f779f955f535c9762e439438746645568fee428bd4fbf2d249d612ae7a7b030  /tmp/patch.b64" | sha256sum -c -
          base64 -d /tmp/patch.b64 | gzip -dc > /tmp/change.diff
          git apply --check /tmp/change.diff
          git apply /tmp/change.diff
          rm -rf .github/mark-place
          rm -f .github/workflows/apply-mark-place.yml
          git add -A
          git config user.name "MCR-Game-Project"
          git config user.email "mcr@steinjager.com"
          python3 - <<'PY'
          import subprocess
          msg = (
              "Place the shops Mark named and move the depot and the school.\n"
              "\n"
              "The bank's neighbors are a general store, a clothing store, the post office, and a furniture store. The Gridley end of Ball Bros. is two-story brick. The Hendee Elevator stands in front of the Hendee House. The T. P. & W. depot is on the east side at Hurst. The 1875 school is at Cole and Hurst, with a cupola, and Twyman Street stays.\n"
              "\n"
              "Co-authored-by: mcr <mcr@steinjager.com>\n"
          )
          subprocess.run(["git", "commit", "-m", msg], check=True)
          PY
          git push origin HEAD:main

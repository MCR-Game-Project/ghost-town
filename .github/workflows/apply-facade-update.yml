name: Apply facade update

on:
  push:
    paths:
      - .github/workflows/apply-facade-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the facade patch and publish the town data
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import base64, gzip, hashlib, pathlib, sys
          parts = []
          for i in range(8):
              parts.append(pathlib.Path(f"scripts/payload.{i}").read_text())
          raw = gzip.decompress(base64.b64decode("".join("".join(parts).split())))
          expect = "be85f29776909560a121a24da45345bcf4249832"
          got = hashlib.sha1(b"blob %d\0" % len(raw) + raw).hexdigest()
          print("patch", got)
          if got != expect:
              sys.exit("patch payload does not match")
          pathlib.Path("/tmp/src.patch").write_bytes(raw)
          PY
          git apply --check /tmp/src.patch
          git apply /tmp/src.patch
          python3 scripts/apply-facades.py
          python3 - << 'PY'
          import hashlib, pathlib, sys
          expected = {
              "README.md": "3803e855594cf4f8884e8e2a97cb02f2e775924f",
              "SOURCES.md": "5d6ee63ed06cfb4cc15038472fc41f0b9b439e99",
              "scripts/apply-facades.py": "041e31d7a6a69b6f42fc3e1962e2c3542ab1de04",
              "scripts/build-town-data.py": "156250770d0dbebf11126a733cea23beb0551e9e",
              "src/main.js": "2311d129a7c64ce548a8d3c713665e9c1c40d443",
              "src/town.js": "368b756d5d587416e3eb8a2b52d9393ff7d01eac",
              "public/data/bushnell-1880.json": "d51ef68a28a65c328f5997aef14a59f714f9d79f",
          }
          for path, want in expected.items():
              data = pathlib.Path(path).read_bytes()
              got = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
              print(path, got)
              if got != want:
                  sys.exit("mismatch " + path)
          PY
          git config user.name "MCR-Game-Project"
          git config user.email "mcr@steinjager.com"
          git add README.md SOURCES.md scripts/apply-facades.py scripts/build-town-data.py src/main.js src/town.js public/data/bushnell-1880.json
          git rm -f scripts/payload.0 scripts/payload.1 scripts/payload.2 scripts/payload.3 scripts/payload.4 scripts/payload.5 scripts/payload.6 scripts/payload.7 .github/workflows/apply-facade-update.yml
          git commit -m "Match photographed facades and add Gridley and the 500 block."
          git push origin HEAD:main

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          repo="${{ github.repository }}"
          branch="${{ github.event.repository.default_branch }}"
          {
            echo "GET"
            gh api "repos/${repo}/pages"
            echo "get_exit:$?"
            echo "POST with source"
            jq -n --arg branch "$branch" '{build_type:"workflow",source:{branch:$branch,path:"/"}}' | gh api -X POST "repos/${repo}/pages" --input -
            echo "post1_exit:$?"
            echo "POST build_type only"
            jq -n '{build_type:"workflow"}' | gh api -X POST "repos/${repo}/pages" --input -
            echo "post2_exit:$?"
          } > pages-api.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-api.txt
          git diff --cached --quiet || git commit -m "Record the GitHub Pages API response"
          git push
          exit 0

      - name: Restore the town file on the first publish
        run: |
          set -euo pipefail
          if [ -f public/data/bushnell-1880.json ]; then
            exit 0
          fi
          cat scripts/town-b64/part-?? | base64 -d | gzip -dc > public/data/bushnell-1880.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/bushnell-1880.json
          git commit -m "Add the downtown Bushnell town file"
          git push

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: |
          test -s public/data/bushnell-1880.json
          npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
